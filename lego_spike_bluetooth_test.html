<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LEGO SPIKE Remote – Test Bluetooth</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #101318;
      color: white;
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: #1b2028;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #cbd3dc; line-height: 1.45; }
    button {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 18px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      background: #1976d2;
      color: white;
    }
    button:active { transform: scale(.99); }
    .status {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #12161c;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }
    .ok { color: #7ee787; }
    .bad { color: #ff8b8b; }
    .small { font-size: 13px; color: #8f9aaa; margin-top: 18px; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
  <main class="card">
    <h1>LEGO SPIKE Remote</h1>
    <p>Test Bluetooth pour hub LEGO sous firmware SPIKE.</p>

    <button id="connectBtn">🔵 CONNECTER LE HUB</button>

    <div id="status" class="status">⚪ En attente…</div>

    <div class="small">
      Service recherché : <code>FD02</code><br>
      Aucun moteur ne sera activé pendant ce test.
    </div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const connectBtn = document.getElementById('connectBtn');

    // UUID complet correspondant au service LEGO Wireless Protocol FD02.
    const LEGO_SERVICE = '0000fd02-0000-1000-8000-00805f9b34fb';

    function setStatus(text, cls='') {
      statusEl.className = 'status ' + cls;
      statusEl.textContent = text;
    }

    connectBtn.addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        setStatus('❌ Web Bluetooth indisponible dans ce navigateur.', 'bad');
        return;
      }

      try {
        setStatus('🔎 Recherche du hub…');

        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [LEGO_SERVICE] }],
          optionalServices: [LEGO_SERVICE]
        });

        setStatus('🔗 Connexion à ' + (device.name || 'LEGO Hub') + '…');

        const server = await device.gatt.connect();
        await server.getPrimaryService(LEGO_SERVICE);

        setStatus('✅ Hub connecté : ' + (device.name || 'LEGO Hub'), 'ok');

        device.addEventListener('gattserverdisconnected', () => {
          setStatus('⚪ Hub déconnecté.');
        });

      } catch (err) {
        if (err && err.name === 'NotFoundError') {
          setStatus('⚠️ Aucun hub sélectionné ou détecté.', 'bad');
        } else {
          setStatus('❌ ' + (err.message || err), 'bad');
        }
      }
    });
  </script>
</body>
</html>
